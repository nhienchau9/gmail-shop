<!doctype html>
<html lang="vi">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cửa hàng</title>
<!-- Generated by build_webapp.py from config.py. Edit template.html, not index.html. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f1f3f6);
    --text: var(--tg-theme-text-color, #14161a);
    --hint: var(--tg-theme-hint-color, #7d838d);
    --accent: var(--tg-theme-button-color, #2f7cf6);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --link: var(--tg-theme-link-color, #2f7cf6);
    --line: rgba(128, 128, 128, .18);
    --danger: #e5484d;
    --warn: #d98a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--tg-theme-bg-color, #16181c);
      --card: var(--tg-theme-secondary-bg-color, #22252b);
      --text: var(--tg-theme-text-color, #f1f2f4);
      --hint: var(--tg-theme-hint-color, #8b919c);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding: 14px 12px calc(96px + env(safe-area-inset-bottom));
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 2px 12px; }
  .top h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
  .top .upd { color: var(--hint); font-size: 12px; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 620px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  .card {
    position: relative; overflow: hidden;
    background: var(--card); border-radius: 14px; border: 2px solid transparent;
    padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 6px;
    min-height: 196px; transition: border-color .15s;
  }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--hue); }
  .card.selected { border-color: var(--accent); }
  .card.open { grid-column: 1 / -1; }
  .card.out { opacity: .55; }
  .row1 { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .code { font-weight: 700; font-size: 11.5px; letter-spacing: .04em; padding: 2px 7px; border-radius: 6px;
          background: var(--hue-soft); color: var(--hue); }
  .stock { font-size: 12px; color: var(--hint); white-space: nowrap; }
  .stock.low { color: var(--warn); }
  .stock.zero { color: var(--danger); font-weight: 600; }
  .title { font-weight: 650; font-size: 14.5px; line-height: 1.25; margin: 2px 0 0; }
  .lines { margin: 0; padding: 0; list-style: none; color: var(--hint); font-size: 12.5px; line-height: 1.35; }
  .lines li { padding-left: 10px; position: relative; }
  .lines li::before { content: "•"; position: absolute; left: 0; }
  .price { font-size: 17px; font-weight: 700; margin-top: auto; padding-top: 4px; }
  .price small { font-size: 11px; color: var(--hint); font-weight: 500; }
  .more { align-self: flex-start; background: none; border: 0; padding: 2px 0; color: var(--link);
          font: inherit; font-size: 12.5px; cursor: pointer; }
  .full { font-size: 13px; line-height: 1.55; border-top: 1px solid var(--line); padding-top: 8px; }
  .pick { border: 0; border-radius: 10px; padding: 9px 8px; background: var(--accent); color: var(--accent-text);
          font: inherit; font-weight: 600; cursor: pointer; }
  .pick:disabled { background: var(--line); color: var(--hint); cursor: default; }
  .buybox { display: flex; flex-direction: column; gap: 7px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { flex: none; width: 38px; height: 38px; border-radius: 10px; border: 0; background: var(--bg);
                    color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; }
  .stepper button:disabled { opacity: .35; }
  .stepper input { flex: 1; min-width: 0; width: 100%; height: 38px; border-radius: 10px;
                   border: 1.5px solid var(--accent); background: var(--bg); color: var(--text);
                   text-align: center; font: inherit; font-size: 16px; font-weight: 700; }
  .stepper input:focus { outline: none; box-shadow: 0 0 0 3px rgba(47, 124, 246, .25); }
  .chips { display: flex; gap: 5px; }
  .chips button { flex: 1; padding: 6px 0; border-radius: 8px; border: 0; background: var(--bg); color: var(--text);
                  font: inherit; font-size: 12.5px; cursor: pointer; }
  .chips button[disabled] { opacity: .35; }
  .sub { font-size: 12.5px; color: var(--hint); }
  .sub b { color: var(--text); }
  .err { color: var(--danger); font-size: 12px; min-height: 0; }
  .cancel { background: none; border: 0; color: var(--hint); font: inherit; font-size: 12px; cursor: pointer; padding: 0; align-self: center; }
  .empty { text-align: center; color: var(--hint); padding: 40px 0; }

  /* Only used outside Telegram (browser preview); inside Telegram the native MainButton is used. */
  #bar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); display: none; }
  #bar button { width: 100%; border: 0; border-radius: 12px; padding: 14px; background: var(--accent);
                color: var(--accent-text); font: inherit; font-weight: 650; font-size: 15px; }
  #bar button:disabled { opacity: .5; }
  #toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: rgba(20, 22, 26, .92); color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13px;
           max-width: calc(100% - 32px); display: none; text-align: center; }
</style>
</head>
<body>
<div class="top"><h1 id="h1"></h1><span class="upd" id="upd"></span></div>
<div class="grid" id="grid"></div>
<div id="bar"><button id="barBtn" type="button"></button></div>
<div id="toast"></div>

<script>
const CATALOG = {"store": "Gmail Store", "currency": "VNĐ", "max_qty": 1000, "order": ["C2FA", "D2FA", "M2FA", "P2FA", "FACEBOOK"], "items": {"C2FA": {"label": "C2FA Gmail", "title": "Gmail Châu Âu cổ", "lines": ["Tạo 2016–2019", "Có lịch sử thanh toán", "Đổi được 2FA + info"], "hue": "#0d9488", "price": 30000, "full_html": "📋 Định dạng: <b>Tài khoản | Mật khẩu | 8 Code mã dự phòng (hoặc 2FA)<\/b><br>⚠️ <i>Lưu ý: mỗi code dự phòng chỉ được sử dụng 1 lần là hết.<\/i><br><b>Gmail Châu Âu cổ 2016–2019<\/b><br>• Có lịch sử thanh toán<br>• 2FA (có thể thay đổi)<br>• Có thể thay đổi toàn bộ thông tin<br><br>🛡 <b>Bảo hành 24 giờ<\/b> kể từ lần login đầu tiên.<br>Lỗi login đổi 1 đổi 1."}, "D2FA": {"label": "D2FA Gmail", "title": "Gmail Châu Âu cổ", "lines": ["Tạo 2016–2019", "Có lịch sử thanh toán", "Dính 2FA cố định"], "hue": "#d97706", "price": 25000, "full_html": "📋 Định dạng: <b>Tài khoản | Mật khẩu | 8 Code mã dự phòng (hoặc 2FA)<\/b><br>⚠️ <i>Lưu ý: mỗi code dự phòng chỉ được sử dụng 1 lần là hết.<\/i><br><b>Gmail Châu Âu cổ 2016–2019<\/b><br>• Có lịch sử thanh toán<br>• Đã dính 2FA (không thể thay đổi)<br>• Không thể thay đổi toàn bộ thông tin<br><br>🛡 <b>Bảo hành 24 giờ<\/b> kể từ lần login đầu tiên.<br>Lỗi login đổi 1 đổi 1."}, "M2FA": {"label": "M2FA Gmail Mỹ", "title": "Gmail Mỹ cổ", "lines": ["Tạo 2016–2019", "Có lịch sử thanh toán", "Đổi được 2FA + info"], "hue": "#4f46e5", "price": 35000, "full_html": "📋 Định dạng: <b>Tài khoản | Mật khẩu | 8 Code mã dự phòng (hoặc 2FA)<\/b><br>⚠️ <i>Lưu ý: mỗi code dự phòng chỉ được sử dụng 1 lần là hết.<\/i><br><b>Gmail Mỹ cổ 2016–2019<\/b><br>• Có lịch sử thanh toán<br>• 2FA (có thể thay đổi)<br>• Có thể thay đổi toàn bộ thông tin<br><br>🛡 <b>Bảo hành 24 giờ<\/b> kể từ lần login đầu tiên.<br>Lỗi login đổi 1 đổi 1."}, "P2FA": {"label": "P2FA Gmail Trial YouTube Premium", "title": "Gmail trial YouTube Premium", "lines": ["Châu Âu cổ 2016–2019", "Trial YT Premium", "Đổi được 2FA + info"], "hue": "#e11d48", "price": 40000, "full_html": "📋 Định dạng: <b>Tài khoản | Mật khẩu | 8 Code mã dự phòng (hoặc 2FA)<\/b><br>⚠️ <i>Lưu ý: mỗi code dự phòng chỉ được sử dụng 1 lần là hết.<\/i><br><b>Gmail Châu Âu cổ 2016–2019<\/b><br>• Có lịch sử trial YouTube Premium<br>• Có lịch sử thanh toán<br>• 2FA (có thể thay đổi)<br>• Có thể thay đổi toàn bộ thông tin<br><br>🛡 <b>Bảo hành 24 giờ<\/b> kể từ lần login đầu tiên.<br>Lỗi login đổi 1 đổi 1."}, "FACEBOOK": {"label": "Facebook Random IP Siêu Cổ", "title": "Facebook Random IP siêu cổ", "lines": ["Xác thực Gmail cổ", "10–1000 bạn bè", "Đổi ALL · BH 24h"], "hue": "#1877f2", "price": 130000, "full_html": "Facebook Random IP siêu cổ, xác thực bằng Gmail cổ, có 10–1000 bạn bè, hoạt động ổn định và hỗ trợ Đổi ALL.<br>Phù hợp nuôi Facebook, seeding, xây dựng profile, marketing và kinh doanh online lâu dài.<br>Bảo hành đăng nhập 24 giờ, lỗi đổi 1–1; không bảo hành sau khi khách tự thay đổi thông tin."}}};

(function () {
  "use strict";
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(tg && tg.initData);
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  const params = new URLSearchParams(location.search);
  const lang = params.get("l") === "en" ? "en" : "vi";
  const T = {
    vi: { title: "Chọn sản phẩm", left: "Còn", out: "Hết hàng", more: "Xem thêm ▾", less: "Thu gọn ▴",
          pick: "Chọn mua", soldout: "Hết hàng", qty: "Số lượng", total: "Thành tiền", buy: "Mua",
          cancel: "Bỏ chọn", max: "Tối đa", updated: "Cập nhật", perAcc: "/ tài khoản",
          needTg: "Hãy mở cửa hàng bằng nút 🛒 trong bot để đặt mua.",
          pickFirst: "Chọn một sản phẩm để mua", none: "Chưa có sản phẩm." },
    en: { title: "Choose a product", left: "Left", out: "Sold out", more: "More ▾", less: "Less ▴",
          pick: "Select", soldout: "Sold out", qty: "Quantity", total: "Total", buy: "Buy",
          cancel: "Deselect", max: "Max", updated: "Updated", perAcc: "/ account",
          needTg: "Open the shop with the 🛒 button in the bot to order.",
          pickFirst: "Pick a product to buy", none: "No products yet." },
  }[lang];

  const MAX_QTY = (CATALOG && CATALOG.max_qty) || 1000;
  const currency = (CATALOG && CATALOG.currency) || "VNĐ";
  const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");

  // Live price + stock come from the bot in the link: s=C2FA:30000:118,D2FA:25000:64
  const live = {};
  (params.get("s") || "").split(",").forEach((part) => {
    const [code, price, stock] = part.split(":");
    if (!code) return;
    live[code] = { price: parseInt(price, 10) || 0, stock: stock === undefined || stock === "" ? null : (parseInt(stock, 10) || 0) };
  });
  const hasLive = Object.keys(live).length > 0;
  const items = ((CATALOG && CATALOG.order) || [])
    .filter((code) => !hasLive || live[code])
    .map((code) => {
      const c = CATALOG.items[code] || {};
      const l = live[code] || { price: c.price || 0, stock: null };
      return { code, ...c, price: l.price, stock: l.stock };
    });

  const sel = { code: null, qty: 1 };
  const openSet = new Set();
  const grid = document.getElementById("grid");
  document.getElementById("h1").textContent = T.title;
  document.title = (CATALOG && CATALOG.store) || T.title;

  const ts = parseInt(params.get("t") || "0", 10);
  if (ts) {
    const d = new Date(ts * 1000);
    document.getElementById("upd").textContent =
      T.updated + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  const haptic = (kind) => { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} };
  const maxFor = (it) => Math.max(0, Math.min(MAX_QTY, it.stock === null ? MAX_QTY : it.stock));
  const byCode = (code) => items.find((i) => i.code === code);

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.style.display = "block";
    clearTimeout(toast._h); toast._h = setTimeout(() => (t.style.display = "none"), 2600);
  }

  function buildCard(it) {
    const card = el("article", "card");
    card.dataset.code = it.code;
    card.style.setProperty("--hue", it.hue || "#2f7cf6");
    card.style.setProperty("--hue-soft", (it.hue || "#2f7cf6") + "26");
    const out = it.stock !== null && it.stock <= 0;
    if (out) card.classList.add("out");
    if (sel.code === it.code) card.classList.add("selected");
    if (openSet.has(it.code)) card.classList.add("open");

    const row1 = el("div", "row1");
    row1.appendChild(el("span", "code", it.code));
    if (it.stock !== null) {
      const st = el("span", "stock" + (out ? " zero" : it.stock < 10 ? " low" : ""),
        out ? T.out : T.left + " " + fmt(it.stock));
      row1.appendChild(st);
    }
    card.appendChild(row1);
    card.appendChild(el("h2", "title", it.title || it.label || it.code));

    const ul = el("ul", "lines");
    (it.lines || []).slice(0, 3).forEach((line) => ul.appendChild(el("li", null, line)));
    card.appendChild(ul);

    if (openSet.has(it.code) && it.full_html) {
      const full = el("div", "full");
      full.innerHTML = it.full_html;   // trusted: written by the shop owner in config.py
      card.appendChild(full);
    }
    if (it.full_html) {
      const more = el("button", "more", openSet.has(it.code) ? T.less : T.more);
      more.type = "button";
      more.addEventListener("click", () => {
        openSet.has(it.code) ? openSet.delete(it.code) : openSet.add(it.code);
        haptic(); refreshCard(it.code);
        if (openSet.has(it.code)) document.querySelector(`.card[data-code="${it.code}"]`).scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
      card.appendChild(more);
    }

    const price = el("div", "price", fmt(it.price) + " ");
    price.appendChild(el("small", null, currency + " " + T.perAcc));
    card.appendChild(price);

    if (sel.code === it.code) {
      card.appendChild(buildBuyBox(it));
    } else {
      const pick = el("button", "pick", out ? T.soldout : T.pick);
      pick.type = "button";
      pick.disabled = out;
      pick.addEventListener("click", () => select(it.code));
      card.appendChild(pick);
    }
    return card;
  }

  function buildBuyBox(it) {
    const box = el("div", "buybox");
    const max = maxFor(it);
    const stepper = el("div", "stepper");
    const minus = el("button", null, "−"); minus.type = "button"; minus.setAttribute("aria-label", "-1");
    const plus = el("button", null, "+"); plus.type = "button"; plus.setAttribute("aria-label", "+1");
    const input = el("input");
    input.type = "text"; input.inputMode = "numeric"; input.pattern = "[0-9]*"; input.autocomplete = "off";
    input.setAttribute("aria-label", T.qty);
    input.value = String(sel.qty);
    stepper.append(minus, input, plus);

    const chips = el("div", "chips");
    [1, 5, 10, 20].forEach((n) => {
      const b = el("button", null, String(n)); b.type = "button";
      if (n > max) b.disabled = true;
      b.addEventListener("click", () => setQty(n, true));
      chips.appendChild(b);
    });

    const sub = el("div", "sub");
    const err = el("div", "err");
    const cancel = el("button", "cancel", T.cancel); cancel.type = "button";

    function paint() {
      const valid = sel.qty >= 1 && sel.qty <= max;
      minus.disabled = sel.qty <= 1;
      plus.disabled = sel.qty >= max;
      sub.innerHTML = "";
      sub.append(T.total + ": ");
      sub.appendChild(el("b", null, fmt(it.price * (valid ? sel.qty : 0)) + " " + currency));
      err.textContent = valid ? "" : (T.max + " " + fmt(max));
      updateMainButton();
    }
    function setQty(n, writeInput) {
      sel.qty = n;
      if (writeInput) input.value = String(n);
      haptic(); paint();
    }
    minus.addEventListener("click", () => setQty(Math.max(1, sel.qty - 1), true));
    plus.addEventListener("click", () => setQty(Math.min(max, sel.qty + 1), true));
    input.addEventListener("input", () => {
      const digits = input.value.replace(/\D/g, "").slice(0, 4);
      if (digits !== input.value) input.value = digits;
      sel.qty = digits ? parseInt(digits, 10) : 0;
      paint();
    });
    input.addEventListener("blur", () => {
      if (!sel.qty || sel.qty < 1) setQty(1, true);
      else if (sel.qty > max) setQty(max, true);
    });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
    cancel.addEventListener("click", () => select(null));

    box.append(stepper, chips, sub, err, cancel);
    setTimeout(paint, 0);
    return box;
  }

  function refreshCard(code) {
    const it = byCode(code);
    const old = grid.querySelector(`.card[data-code="${code}"]`);
    if (it && old) old.replaceWith(buildCard(it));
  }

  function select(code) {
    const prev = sel.code;
    sel.code = code; sel.qty = 1;
    if (prev) refreshCard(prev);
    if (code) refreshCard(code);
    haptic();
    updateMainButton();
  }

  function currentOrder() {
    if (!sel.code) return null;
    const it = byCode(sel.code);
    if (!it) return null;
    const max = maxFor(it);
    if (!(sel.qty >= 1 && sel.qty <= max)) return null;
    return { it, qty: sel.qty, total: it.price * sel.qty };
  }

  function buttonText(o) {
    return o ? `🛒 ${T.buy} ${o.qty} × ${o.it.code} · ${fmt(o.total)} ${currency}` : T.pickFirst;
  }

  function updateMainButton() {
    const o = currentOrder();
    if (inTelegram && tg.MainButton) {
      if (!sel.code) { tg.MainButton.hide(); return; }
      tg.MainButton.setText(buttonText(o));
      o ? tg.MainButton.enable() : tg.MainButton.disable();
      tg.MainButton.show();
    } else {
      const bar = document.getElementById("bar");
      const btn = document.getElementById("barBtn");
      bar.style.display = sel.code ? "block" : "none";
      btn.textContent = buttonText(o);
      btn.disabled = !o;
    }
  }

  function submit() {
    const o = currentOrder();
    if (!o) return;
    const payload = JSON.stringify({ p: o.it.code, q: o.qty });
    if (!inTelegram) { toast(T.needTg); return; }
    try {
      tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
      tg.sendData(payload);       // closes the Mini App; the bot replies with the payment step
    } catch (e) {
      toast(T.needTg);
    }
  }

  if (inTelegram && tg.MainButton) tg.MainButton.onClick(submit);
  document.getElementById("barBtn").addEventListener("click", submit);

  if (!items.length) {
    grid.appendChild(el("div", "empty", T.none));
  } else {
    items.forEach((it) => grid.appendChild(buildCard(it)));
  }
  updateMainButton();
})();
</script>
</body>
